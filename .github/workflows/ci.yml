name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rss_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rss_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.12.16
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests migrations scripts/ci
      - run: sh -n docker/init-db/001-create-roles.sh
      - run: sh -n docker/worker.sh
      - run: DB_HOST=localhost DB_NAME=rss_agent DB_MIGRATION_USER=migrator DB_MIGRATION_PASSWORD=placeholder uv run --frozen alembic upgrade head --sql > migration.sql
      - run: uv run --frozen python scripts/ci/bootstrap_test_roles.py
        env:
          CI_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/rss_agent
          CI_MIGRATION_PASSWORD: migrate_test
          CI_APP_PASSWORD: app_test
      - run: uv run --frozen alembic upgrade head
        env:
          MIGRATIONS_DATABASE_URL: postgresql+psycopg://rss_migrator:migrate_test@localhost:5432/rss_agent
      - run: uv run --frozen pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rss_agent_app:app_test@localhost:5432/rss_agent
      - run: docker build -t rss-surveillance-agent:${{ github.sha }} .
