[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rss-surveillance-agent"
version = "0.1.0"
description = "A learning project for building an auditable RSS surveillance agent."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "httpx>=0.27,<1",
    "openai>=1.68,<3",
    "langgraph>=0.6,<2",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.12,<1"]

[project.scripts]
rss-surveillance = "rss_surveillance_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

